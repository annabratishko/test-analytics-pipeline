version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null
      - name: is_paying_customer
        tests:
          - accepted_values:
              arguments:
                values: [true, false]

  - name: fact_orders
    columns:
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id